<!DOCTYPE html>
<html>
<head>
    <title>Calorie Calculator</title>
</head>
<body>
    <nav>
        <a href="ideal_weight.html">Ideal Weight Calculator</a> |
        <a href="calorie_calculator.html">Calorie Calculator</a> |
        <a href="keto_diet.html">Keto Diet Plan</a>
    </nav>
    <hr>
    <h1>Calorie Calculator</h1>

    <label for="weight">Weight (kg):</label>
    <input type="number" id="weight"><br><br>

    <label for="height">Height (cm):</label>
    <input type="number" id="height"><br><br>

    <label for="age">Age (years):</label>
    <input type="number" id="age"><br><br>

    <label for="gender">Gender:</label>
    <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select><br><br>

    <label for="activityLevel">Physical Activity Level:</label>
    <select id="activityLevel">
        <option value="light">Light</option>
        <option value="moderate">Moderate</option>
        <option value="active">Active</option>
        <option value="very_active">Very Active</option>
    </select><br><br>

    <button id="calculateBtn">Calculate</button><br><br>

    <h2>Results:</h2>
    <div>
        <strong>Recommended daily calories to maintain current weight:</strong> <span id="maintenanceCalories"></span>
    </div>
    <div>
        <strong>Recommended daily calories for weight loss:</strong> <span id="lossCalories"></span>
    </div>
    <div>
        <strong>Recommended daily calories for weight gain:</strong> <span id="gainCalories"></span>
    </div>
    <div>
        <strong>Tips and Guidance:</strong> <span id="tips"></span>
    </div>

    <script src="calorie_calculator.js" defer></script>
</body>
</html>
