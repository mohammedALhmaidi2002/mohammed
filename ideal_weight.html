<!DOCTYPE html>
<html>
<head>
    <title>Ideal Weight Calculator</title>
</head>
<body>
    <nav>
        <a href="ideal_weight.html">Ideal Weight Calculator</a> |
        <a href="calorie_calculator.html">Calorie Calculator</a> |
        <a href="keto_diet.html">Keto Diet Plan</a>
    </nav>
    <hr>
    <h1>Ideal Weight Calculator</h1>

    <label for="height">Height (cm):</label>
    <input type="number" id="height"><br><br>

    <label for="age">Age (years):</label>
    <input type="number" id="age"><br><br>

    <label for="gender">Gender:</label>
    <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select><br><br>

    <button id="calculateBtn">Calculate</button><br><br>

    <h2>Results:</h2>
    <div>
        <strong>Suggested Ideal Weight:</strong> <span id="idealWeight"></span>
    </div>
    <div>
        <strong>Healthy Weight Range:</strong> <span id="healthyWeightRange"></span>
    </div>
    <div>
        <strong>Weight Status:</strong> <span id="weightStatus"></span>
    </div>
    <div>
        <strong>Tips and Guidance:</strong> <span id="tips"></span>
    </div>

    <script src="ideal_weight.js" defer></script>
</body>
</html>
